<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モザイク加工ツール</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 16px;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 16px 0;
      text-align: center;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    /* 内カメラを鏡像（左右反転）にして自然な見た目に */
    video {
      width: 100%;
      border-radius: 12px;
      background: #000;
      display: block;
      transform: scaleX(-1);
    }
    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .slider-header {
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    input[type="range"] {
      width: 100%;
      margin: 4px 0;
      display: block;
      accent-color: #4facfe;
    }
    .btn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, #3a7bd5, #00d2ff);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .btn:active {
      opacity: 0.85;
    }
    .secondary-btn {
      background: linear-gradient(90deg, #434343, #000000);
    }
    /* 小さく横並びにする結果表示エリア */
    .result-box {
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 6px;
    }
    .image-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .image-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px;
      border-radius: 10px;
    }
    .image-card p {
      margin: 0 0 6px 0;
      font-size: 0.75rem;
      color: #ccc;
      text-align: center;
    }
    .image-card canvas {
      width: 100%;
      height: auto;
      border-radius: 6px;
      background: #000;
      display: block;
    }
    .download-btn {
      background: #28a745;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      color: white;
      font-size: 0.9rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>モザイク加工ツール</h1>

  <div class="container">
    <!-- 内カメラ映像 -->
    <video id="video" autoplay playsinline muted></video>

    <div class="controls" id="captureControls">
      <button type="button" class="btn" id="snapBtn">内カメラで写真を撮る</button>
    </div>

    <!-- 撮影後の調整・確認用コントロール -->
    <div class="controls" id="adjustControls" style="display: none;">
      <div class="slider-header">
        <span>モザイクの粗さ</span>
        <span id="mosaicValue">15</span>
      </div>
      <input type="range" id="mosaicSize" min="5" max="50" value="15">

      <button type="button" class="btn" id="applyBtn">モザイクを確定する</button>
      <button type="button" class="btn secondary-btn" id="retakeBtn">撮り直す</button>
    </div>

    <!-- 結果表示エリア（小さく横並び） -->
    <div class="result-box" id="resultBox">
      <div class="image-row">
        <div class="image-card">
          <p>加工前</p>
          <canvas id="originalCanvas"></canvas>
        </div>
        <div class="image-card">
          <p>加工後</p>
          <canvas id="mosaicCanvas"></canvas>
        </div>
      </div>
      <a id="downloadLink" class="download-btn" download="mosaic_image.png">モザイク画像を保存する</a>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const snapBtn = document.getElementById('snapBtn');
    const applyBtn = document.getElementById('applyBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const mosaicSizeInput = document.getElementById('mosaicSize');
    const mosaicValue = document.getElementById('mosaicValue');
    
    const captureControls = document.getElementById('captureControls');
    const adjustControls = document.getElementById('adjustControls');
    const resultBox = document.getElementById('resultBox');
    
    const originalCanvas = document.getElementById('originalCanvas');
    const mosaicCanvas = document.getElementById('mosaicCanvas');
    const downloadLink = document.getElementById('downloadLink');

    let capturedSource = null;

    // 内カメラ（user）の起動
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        console.log('カメラが許可されていないか利用できません:', err);
      }
    }
    startCamera();

    // 写真を撮るボタン
    snapBtn.addEventListener('click', () => {
      if (!video.videoWidth) return;
      
      // 撮影時の映像を一時Canvasに保存（内カメラの反転を考慮）
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = video.videoWidth;
      tempCanvas.height = video.videoHeight;
      const ctx = tempCanvas.getContext('2d');
      ctx.translate(tempCanvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0);
      
      capturedSource = tempCanvas;

      // 表示切り替え
      video.style.display = 'none';
      captureControls.style.display = 'none';
      adjustControls.style.display = 'flex';

      // 初期状態でプレビュー生成
      generatePreview();
    });

    // スライダー変更時の数値更新
    mosaicSizeInput.addEventListener('input', () => {
      mosaicValue.textContent = mosaicSizeInput.value;
      if (capturedSource) {
        generatePreview();
      }
    });

    // プレビュー生成（スライダー操作中）
    function generatePreview() {
      if (!capturedSource) return;
      const w = capturedSource.width;
      const h = capturedSource.height;
      
      // 加工前を描画（小さく表示）
      originalCanvas.width = w;
      originalCanvas.height = h;
      originalCanvas.getContext('2d').drawImage(capturedSource, 0, 0);

      // モザイク加工プレビュー
      drawMosaic(capturedSource, mosaicCanvas, parseInt(mosaicSizeInput.value, 10));
    }

    // モザイク確定ボタン
    applyBtn.addEventListener('click', () => {
      generatePreview();
      downloadLink.href = mosaicCanvas.toDataURL('image/png');
      resultBox.style.display = 'flex';
    });

    // 撮り直すボタン
    retakeBtn.addEventListener('click', () => {
      resultBox.style.display = 'none';
      adjustControls.style.display = 'none';
      video.style.display = 'block';
      captureControls.style.display = 'flex';
      capturedSource = null;
    });

    // モザイク描画の共通関数
    function drawMosaic(source, targetCanvas, blockSize) {
      const w = source.width;
      const h = source.height;

      targetCanvas.width = w;
      targetCanvas.height = h;
      const tCtx = targetCanvas.getContext('2d');

      const smallW = Math.max(1, Math.floor(w / blockSize));
      const smallH = Math.max(1, Math.floor(h / blockSize));

      const offscreen = document.createElement('canvas');
      offscreen.width = smallW;
      offscreen.height = smallH;
      const offCtx = offscreen.getContext('2d');

      offCtx.drawImage(source, 0, 0, smallW, smallH);

      tCtx.imageSmoothingEnabled = false;
      tCtx.drawImage(offscreen, 0, 0, smallW, smallH, 0, 0, w, h);
    }
  </script>
</body>
</html>
